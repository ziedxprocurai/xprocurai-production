[build]
  command = "npm install && npx prisma generate && npm run build"
  publish = ".next"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

# Next.js on Netlify plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables that must be set in Netlify UI:
# - DATABASE_URL (Supabase pooled connection string)
# - DIRECT_DATABASE_URL (Supabase direct connection string)
# - NEXTAUTH_SECRET
# - NEXTAUTH_URL (https://your-production-domain.com)
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - NEXT_PUBLIC_APP_URL (https://your-production-domain.com)
# - NEXT_PUBLIC_APP_NAME (xProcurAI)
# - JWT_SECRET
# - JWT_REFRESH_SECRET

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects are handled automatically by @netlify/plugin-nextjs
