# Netlify configuration for xProcurAI monorepo
# Build from repo root to handle workspace dependencies

[build]
  command = "npm install && cd apps/web && npx prisma generate && npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"

# Next.js on Netlify plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects are handled automatically by @netlify/plugin-nextjs
[[redirects]]
  from = "/*"
  to = "/.netlify/builders/___netlify-server-handler"
  status = 200
